<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeCraft Pro</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- 🔥 Sidebar -->
<div class="sidebar">
    <h2>💻 CodeCraft</h2>
    <p>Practice. Improve. Repeat.</p>

    <hr>

    <p>✨ Features:</p>
    <ul>
        <li>Live Preview</li>
        <li>AI Feedback</li>
        <li>Modern UI</li>
    </ul>
</div>

<!-- 🚀 Main Section -->
<div class="main">

    <h1>🚀 Web Dev Practice</h1>

    <!-- 📝 Code Input -->
    <textarea id="code" placeholder="Write your HTML/CSS/JS code here..."></textarea>

    <!-- ⚡ Button -->
    <button onclick="evaluateCode()">⚡ Evaluate Code</button>

    <!-- 💬 AI Output -->
    <h3>🧠 AI Feedback</h3>
    <div id="output">Your feedback will appear here...</div>

    <!-- 💻 Live Preview -->
    <h3>💻 Live Preview</h3>
    <iframe id="preview"></iframe>

</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
